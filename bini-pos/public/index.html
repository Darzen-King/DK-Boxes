<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#e6447a">
  <title>BINI POS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/pos.css">
</head>
<body>

  <!-- ╔══════════════════ 離線測試模式提示 ══════════════════╗ -->
  <div id="offlineBanner" class="offline-banner hidden" data-i18n="offlineModeBanner"></div>

  <!-- ╔══════════════════ 登入畫面 ══════════════════╗ -->
  <section id="loginView" class="view login-view">
    <div class="login-card">
      <!-- 語言切換 -->
      <button id="langToggle" class="lang-toggle" type="button">中文 / EN</button>

      <div class="login-brand">
        <div class="login-logo">BINI</div>
        <h1 class="login-title" data-i18n="appName">BINI POS</h1>
        <p class="login-subtitle" data-i18n="appSubtitle">門市銷售系統</p>
      </div>

      <form id="loginForm" class="login-form" autocomplete="off">
        <label class="field">
          <span data-i18n="username">帳號</span>
          <input id="loginUsername" type="text" data-i18n-ph="usernamePlaceholder" autocomplete="username">
        </label>
        <label class="field">
          <span data-i18n="password">密碼</span>
          <input id="loginPassword" type="password" data-i18n-ph="passwordPlaceholder" autocomplete="current-password">
        </label>

        <div id="loginError" class="form-error hidden"></div>

        <button id="loginBtn" type="submit" class="btn-primary" data-i18n="loginBtn">登入</button>
      </form>

      <p class="login-hint" data-i18n="defaultAdminHint"></p>
    </div>
  </section>

  <!-- ╔══════════════════ 強制 / 主動改密碼 ══════════════════╗ -->
  <section id="changePwView" class="view modal-view hidden">
    <div class="modal-card">
      <h2 data-i18n="changePwTitle">變更密碼</h2>
      <p id="changePwForcedMsg" class="muted" data-i18n="changePwForced"></p>
      <form id="changePwForm" class="login-form" autocomplete="off">
        <label class="field">
          <span data-i18n="currentPassword">目前密碼</span>
          <input id="cpCurrent" type="password" autocomplete="current-password">
        </label>
        <label class="field">
          <span data-i18n="newPassword">新密碼</span>
          <input id="cpNew" type="password" autocomplete="new-password">
        </label>
        <label class="field">
          <span data-i18n="confirmPassword">確認新密碼</span>
          <input id="cpConfirm" type="password" autocomplete="new-password">
        </label>
        <div id="cpError" class="form-error hidden"></div>
        <div id="cpSuccess" class="form-success hidden" data-i18n="pwChanged"></div>
        <div class="modal-actions">
          <button id="cpCancelBtn" type="button" class="btn-ghost hidden" data-i18n="cancel">取消</button>
          <button id="cpSubmitBtn" type="submit" class="btn-primary" data-i18n="changePwBtn">更新密碼</button>
        </div>
      </form>
    </div>
  </section>

  <!-- ╔══════════════════ 主畫面（登入後） ══════════════════╗ -->
  <section id="appView" class="view app-view hidden">
    <header class="app-header">
      <div class="app-header-left">
        <span class="app-logo">BINI POS</span>
      </div>
      <div class="app-header-right">
        <span id="userBadge" class="user-badge"></span>
        <button id="appLangToggle" class="icon-btn" type="button">中 / EN</button>
        <button id="appChangePwBtn" class="icon-btn" type="button" data-i18n="changePwTitle">變更密碼</button>
        <button id="logoutBtn" class="icon-btn" type="button" data-i18n="logout">登出</button>
      </div>
    </header>

    <div class="app-body">
      <nav id="moduleNav" class="module-nav"><!-- 由 app.js 動態產生 --></nav>
      <main id="moduleContent" class="module-content"><!-- 由 app.js 動態產生 --></main>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
